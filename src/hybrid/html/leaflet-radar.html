<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>雷达降水</title>
<link rel="stylesheet" href="./leaflet.min.css">
<script src="./leaflet.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#F0F5FA;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;color:#2C3E50}
#app{display:flex;flex-direction:column;width:100%;height:100%}
.top-bar{flex-shrink:0;display:flex;align-items:center;gap:8px;padding:8px 12px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.04);z-index:20}
.title{flex:1;font-size:16px;font-weight:700;color:#5B8FC0}
.update{font-size:10px;color:#B0BDCC;white-space:nowrap}
.ctl-btn{flex-shrink:0;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border:none;background:#EDF2F8;border-radius:8px;font-size:14px;color:#5B8FC0;cursor:pointer}
.ctl-btn.loading{animation:spin .6s linear infinite;pointer-events:none;opacity:.5}
.control-bar{flex-shrink:0;display:flex;align-items:center;gap:12px;padding:6px 12px;background:#fff;border-bottom:1px solid #DDE4ED;font-size:12px;color:#5A6E80;z-index:20}
.sw{display:flex;align-items:center;gap:4px;cursor:pointer;user-select:none}
.sw input{width:16px;height:16px;accent-color:#5B8FC0}
.slider-wrap{flex:1;display:flex;align-items:center;gap:6px;white-space:nowrap}
.slider-wrap input{flex:1;accent-color:#5B8FC0}
.play-btn{flex-shrink:0;width:38px;height:38px;border:none;border-radius:50%;background:#5B8FC0;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 8px rgba(91,143,192,.35);transition:transform .12s,background .12s}
.play-btn:active{transform:scale(.92)}
.play-btn.on{background:#3D6A94}
.timeline-bar{flex-shrink:0;display:flex;align-items:center;gap:8px;padding:5px 12px;background:#fff;border-bottom:1px solid #DDE4ED;z-index:20}
.timeline-bar input[type=range]{flex:1;min-width:0;accent-color:#5B8FC0}
.tl-btn{flex-shrink:0;width:26px;height:26px;border:none;border-radius:50%;background:#EDF2F8;color:#5B8FC0;font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer}
.tl-btn:active{background:#DDE7F2}
.tl-time{flex-shrink:0;min-width:40px;text-align:center;font-size:11px;color:#5A6E80;font-variant-numeric:tabular-nums}
.map-wrap{flex:1;position:relative;min-height:0;background:#E8EEF5}
#map{width:100%;height:100%}
.loading{position:absolute;inset:0;z-index:850;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(240,245,250,.72);color:#5A6E80;font-size:13px}
.loading.show{display:flex}
.spinner{width:30px;height:30px;border:3px solid rgba(91,143,192,.2);border-top-color:#5B8FC0;border-radius:50%;animation:spin .75s linear infinite}
.radar-error{position:absolute;inset:0;z-index:860;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:rgba(240,245,250,.9);text-align:center;padding:24px}
.radar-error.show{display:flex}
.err-icon{font-size:36px}
.err-title{font-size:15px;color:#2C3E50;font-weight:600}
.err-sub{font-size:11px;color:#8B9CAD}
#retryBtn{margin-top:6px;padding:8px 28px;border:none;border-radius:999px;background:#5B8FC0;color:#fff;font-size:13px;font-weight:500;cursor:pointer}
@keyframes spin{to{transform:rotate(360deg)}}
.city-label{padding:3px 10px;border-radius:10px;background:#5B8FC0;color:#fff;font-size:12px;font-weight:600;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.2)}

/* dark */
html.dark,html.dark body{background:#12161E;color:#C8D0DC}
html.dark .top-bar,html.dark .control-bar,html.dark .timeline-bar{background:#1A202A;border-color:rgba(255,255,255,.08)}
html.dark .title{color:#6B9FD0}
html.dark .update{color:#6A7A8A}
html.dark .ctl-btn{background:#232A36;color:#6B9FD0}
html.dark .tl-btn{background:#232A36;color:#6B9FD0}
html.dark .tl-time{color:#8B9CAD}
html.dark .control-bar{color:#8B9CAD}
html.dark .map-wrap{background:#12161E}
html.dark #map .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(0.92) contrast(0.9)}
html.dark .loading{background:rgba(18,22,30,.8);color:#8B9CAD}
html.dark .radar-error{background:rgba(18,22,30,.9)}
html.dark .err-title{color:#E0E6ED}
html.dark .err-sub{color:#6A7A8A}
html.dark .leaflet-control-layers-expanded{background:rgba(30,36,48,.97)!important;color:#C8D0DC;box-shadow:0 2px 12px rgba(0,0,0,.5)!important}
html.dark .leaflet-control-layers-toggle{background-color:rgba(30,36,48,.97)!important}
html.dark .leaflet-control-layers-base label span,.dark .leaflet-control-layers-overlays label span{color:#C8D0DC}
html.dark .leaflet-control-layers-base label:hover,.dark .leaflet-control-layers-overlays label:hover{background:#232A36}
</style>
</head>
<body>
<div id="app">
  <div class="top-bar">
    <span class="title">雷达降水</span>
    <span class="update" id="updateTime"></span>
    <button class="ctl-btn" id="refreshBtn" type="button">&#x21bb;</button>
  </div>
  <div class="control-bar">
    <label class="sw"><input type="checkbox" id="radarToggle" checked> 雷达</label>
    <span class="slider-wrap">透明度 <input type="range" id="opacitySlider" min="20" max="100" value="80"></span>
    <button class="play-btn" id="playBtn" type="button" aria-label="播放/暂停">
      <svg class="ic-play" viewBox="0 0 24 24" width="18" height="18"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
      <svg class="ic-pause" viewBox="0 0 24 24" width="18" height="18" style="display:none"><path d="M6 5h4v14H6zM14 5h4v14h-4z" fill="currentColor"/></svg>
    </button>
  </div>
  <div class="timeline-bar">
    <button class="tl-btn" id="prevFrame" type="button" aria-label="上一帧">&#8249;</button>
    <input type="range" id="timeSlider" min="0" max="0" value="0">
    <button class="tl-btn" id="nextFrame" type="button" aria-label="下一帧">&#8250;</button>
    <span class="tl-time" id="frameTime">--:--</span>
  </div>
  <div class="map-wrap">
    <div id="map"></div>
    <div class="loading" id="loading"><div class="spinner"></div><div>加载雷达数据...</div></div>
    <div class="radar-error" id="radarError">
      <div class="err-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#9AA7B5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="46" height="46"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M16 14v6"/><path d="M8 14v6"/><path d="M12 16v6"/></svg></div>
      <div class="err-title">雷达数据获取失败</div>
      <div class="err-sub">可能是网络受限或服务不可用</div>
      <button id="retryBtn" type="button">重试</button>
    </div>
  </div>
</div>

<script>
var isDark=location.search.indexOf('dark=1')>=0
if(isDark)document.documentElement.className='dark'
var userCoords=(function(){
  var m=location.search.match(/lat=([\d.\-]+)/)
  var n=location.search.match(/lon=([\d.\-]+)/)
  var name=decodeURIComponent((location.search.match(/name=([^&]+)/)||[])[1]||'')
  if(m&&n){
    var lat=parseFloat(m[1]),lon=parseFloat(n[1])
    if(isFinite(lat)&&isFinite(lon))return{lat:lat,lon:lon,name:name}
  }
  return null
})()

var map=null
var layerCache={}
var frames=[] // {path}
var currentIdx=-1
var playTimer=null,playing=false
var host=''
var ERR='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg=='

var $=function(id){return document.getElementById(id)}

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

function setLoading(on){on?$('loading').classList.add('show'):$('loading').classList.remove('show')}

function initMap(){
  map=L.map('map',{center:[20,130],zoom:4,minZoom:3,maxZoom:18,zoomControl:false,attributionControl:false,preferCanvas:true})
  map.createPane('radar')
  map.getPane('radar').style.zIndex=350
  var layers={
    '高德地图':L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',{subdomains:'1234',maxNativeZoom:17,maxZoom:18,errorTileUrl:ERR}),
    '高德卫星':L.tileLayer('https://webst0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}',{subdomains:'1234',maxNativeZoom:17,maxZoom:18,errorTileUrl:ERR})
  }
  layers['高德地图'].addTo(map)
  L.control.layers(layers,null,{position:'bottomright',collapsed:true}).addTo(map)
  if(userCoords){
    map.setView([userCoords.lat,userCoords.lon],7)
    var label=userCoords.name||(userCoords.lat.toFixed(1)+', '+userCoords.lon.toFixed(1))
    var icon=L.divIcon({className:'',html:'<div class="city-label">'+esc(label)+'</div>',iconSize:[0,0],iconAnchor:[0,0]})
    L.marker([userCoords.lat,userCoords.lon],{icon:icon,zIndexOffset:1000}).addTo(map)
  }
  setTimeout(function(){try{map.invalidateSize(false)}catch(e){}},60)
}

function tileUrl(frame){
  return host+frame.path+'/256/{z}/{x}/{y}/1/1_0.png'
}

function radarOn(){ return $('radarToggle').checked }
function baseOp(){ return parseInt($('opacitySlider').value)/100 }

function ensureLayer(i){
  if(layerCache[i])return layerCache[i]
  var lyr=L.tileLayer(tileUrl(frames[i]),{pane:'radar',opacity:0,maxNativeZoom:11,maxZoom:18,attribution:'RainViewer',errorTileUrl:ERR})
  lyr.addTo(map)
  layerCache[i]=lyr
  return lyr
}

function updateTimeLabel(){
  if(currentIdx<0||!frames[currentIdx]){$('frameTime').textContent='--:--';return}
  var d=new Date(frames[currentIdx].time*1000)
  var pad=function(n){return String(n).padStart(2,'0')}
  $('frameTime').textContent=pad(d.getHours())+':'+pad(d.getMinutes())
}

function setFrame(i){
  if(!frames.length)return
  if(i<0)i=0
  if(i>frames.length-1)i=frames.length-1
  currentIdx=i
  ensureLayer(i)
  var o=radarOn()?baseOp():0
  Object.keys(layerCache).forEach(function(k){ layerCache[k].setOpacity(Number(k)===i?o:0) })
  var sl=$('timeSlider')
  if(parseInt(sl.value)!==i)sl.value=i
  updateTimeLabel()
}

function preloadAll(){ for(var i=0;i<frames.length;i++)ensureLayer(i) }

function applyRadarVisibility(){
  if(!frames.length)return
  if(radarOn()){ setFrame(currentIdx<0?frames.length-1:currentIdx) }
  else { Object.keys(layerCache).forEach(function(k){ layerCache[k].setOpacity(0) }) }
}

function applyOpacity(){ if(currentIdx>=0&&layerCache[currentIdx]&&radarOn())layerCache[currentIdx].setOpacity(baseOp()) }

function setPlayIcon(on){
  document.querySelector('.ic-play').style.display=on?'none':'block'
  document.querySelector('.ic-pause').style.display=on?'block':'none'
  $('playBtn').classList.toggle('on',on)
}

function stopPlay(){
  if(playTimer){clearInterval(playTimer);playTimer=null}
  playing=false
  setPlayIcon(false)
}

function togglePlay(){
  if(playing){stopPlay();return}
  if(!frames.length)return
  preloadAll()
  playing=true
  setPlayIcon(true)
  playTimer=setInterval(function(){
    if(!frames.length){stopPlay();return}
    setFrame((currentIdx+1)%frames.length)
  },700)
}

function showRadarError(){
  $('radarError').classList.add('show')
}
function hideRadarError(){
  $('radarError').classList.remove('show')
}

function loadRadar(){
  var btn=$('refreshBtn');btn.classList.add('loading')
  setLoading(true);hideRadarError()
  stopPlay()
  if(map){ Object.keys(layerCache).forEach(function(k){ try{map.removeLayer(layerCache[k])}catch(e){} }) }
  layerCache={};currentIdx=-1
  var x=new XMLHttpRequest()
  x.open('GET','https://api.rainviewer.com/public/weather-maps.json',true)
  x.timeout=10000
  x.onload=function(){
    btn.classList.remove('loading');setLoading(false)
    if(x.status>=200&&x.status<300){
      try{
        var data=JSON.parse(x.responseText)
        host=data.host||'https://tilecache.rainviewer.com'
        frames=(data.radar&&data.radar.past||[]).slice(-14).concat(data.radar&&data.radar.nowcast||[])
        var sl=$('timeSlider')
        sl.max=Math.max(0,frames.length-1)
        sl.value=frames.length-1
        if(frames.length){
          setFrame(frames.length-1)
          var d=new Date(frames[frames.length-1].time*1000)
          var pad=function(n){return String(n).padStart(2,'0')}
          $('updateTime').textContent=pad(d.getHours())+':'+pad(d.getMinutes())
        }else{
          showRadarError()
        }
      }catch(e){console.error(e);showRadarError()}
    }else{
      showRadarError()
    }
  }
  x.onerror=function(){btn.classList.remove('loading');setLoading(false);showRadarError()}
  x.ontimeout=function(){btn.classList.remove('loading');setLoading(false);showRadarError()}
  x.send()
}

initMap()
loadRadar()
$('radarToggle').onchange=applyRadarVisibility
$('opacitySlider').oninput=applyOpacity
$('playBtn').onclick=togglePlay
$('timeSlider').oninput=function(){stopPlay();setFrame(parseInt(this.value))}
$('prevFrame').onclick=function(){stopPlay();setFrame(currentIdx-1)}
$('nextFrame').onclick=function(){stopPlay();setFrame(currentIdx+1)}
$('refreshBtn').onclick=function(){loadRadar()}
$('retryBtn').onclick=function(){loadRadar()}
</script>
</body>
</html>
